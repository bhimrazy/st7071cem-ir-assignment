[project]
name = "st7071cem-ir-assignment"
version = "0.1.0"
description = "Vertical search engine and document clustering system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "bhimrazy", email = "bhimrajyadav977@gmail.com" }]

dependencies = [
    "beautifulsoup4>=4.15.0",  # crawler: parsing publication pages
    "lxml>=6.1.2",             # the parser beautifulsoup is asked to use
    "httpx>=0.28.1",           # crawler and dataset downloads
    "nltk>=3.10.3",            # stopwords and the Porter stemmer
    "fastapi[standard]>=0.141.1",
    "scikit-learn>=1.9.0",     # clustering: TF-IDF and k-means
    "scipy>=1.16.0",           # sparse matrix types
    "matplotlib>=3.11.1",      # figures written by scripts/
]

[project.scripts]
ir-crawl = "crawler.cli:main"
ir-index = "publications.cli:main"
ir-cluster = "clustering.cli:main"
ir-bm25 = "miniseek.worked_example:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.14.0", "ty>=0.0.1a20"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Several top-level modules rather than one named after the distribution:
# each stage stands on its own and none of them owns the others.
module-name = ["miniseek", "crawler", "clustering", "api", "publications"]

[tool.ruff.lint.per-file-ignores]
# One unreadable page should not end a seven minute crawl, so these catch
# broadly on purpose and record the failure in the run's error count.
"src/crawler/crawler.py" = ["BLE001"]
"src/crawler/politeness.py" = ["BLE001"]
# The append-only log holds its handle open for the life of the collection,
# which is the point of it; a context manager would close it after each write.
"src/miniseek/collection.py" = ["SIM115"]
