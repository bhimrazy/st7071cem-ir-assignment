# API key guards a container bound to localhost; it is not a secret.

services:
  typesense:
    image: typesense/typesense:30.2
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data
    command: >
      --data-dir /data
      --api-key=localdev
      --enable-cors

  # Typesense has no UI of its own; :8108 is a REST API.
  dashboard:
    image: bfritscher/typesense-dashboard:2.5.0
    ports:
      - "127.0.0.1:8109:80"
    depends_on:
      - typesense

volumes:
  typesense-data:
